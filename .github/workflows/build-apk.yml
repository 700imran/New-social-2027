name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install web app dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Install Android wrapper dependencies
        working-directory: android
        run: npm install

      - name: Sync web build into the native Android project
        working-directory: android
        run: npm run sync

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        run: |
          set -e
          
          # Create ANDROID_HOME directory structure
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          mkdir -p "$ANDROID_HOME/licenses"
          
          # Download and install cmdline-tools
          cd /tmp
          wget https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -q
          unzip -q commandlinetools-linux-9477386_latest.zip
          mv cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
          cd "$ANDROID_HOME/cmdline-tools/latest/bin"
          
          # Accept licenses
          yes | ./sdkmanager --sdk_root="$ANDROID_HOME" --licenses > /dev/null 2>&1 || true
          
          # Install required SDK components
          ./sdkmanager --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;26.1.10909125" \
            "cmake;3.22.1" || echo "Warning: Some components may have failed"

      - name: Make gradlew executable
        run: chmod +x android/android/gradlew

      - name: Configure release signing
        working-directory: android/android
        run: |
          set -e

          if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > app/release.keystore

            {
              echo "storeFile=release.keystore"
              echo "storePassword=${{ secrets.RELEASE_KEYSTORE_PASSWORD }}"
              echo "keyAlias=${{ secrets.RELEASE_KEY_ALIAS }}"
              echo "keyPassword=${{ secrets.RELEASE_KEY_PASSWORD }}"
            } > keystore.properties

            echo "Release signing configured from repo secrets."
          else
            echo "::warning::RELEASE_KEYSTORE_BASE64 is not set."
          fi

      - name: Build release APK
        working-directory: android/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Read version name for the artifact name
        id: ver
        working-directory: android/android
        run: |
          VERSION=$(grep VERSION_NAME version.properties | cut -d= -f2 | tr -d '[:space:]')
          CLEAN_VERSION=$(echo "$VERSION" | tr -d '#' | sed 's/[<>:|?*]//g' | sed 's/[()]//g')
          echo "name=${CLEAN_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: bharatspace-beta-${{ steps.ver.outputs.name }}
          path: android/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
