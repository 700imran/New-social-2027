apply plugin: 'com.android.application'

// --- Release signing ---------------------------------------------------
// android/keystore.properties is never committed (see android/.gitignore)
// and holds the ONE permanent signing identity for com.bharatspace.app.
// Locally: create it by hand (see android/README.md). In CI: the
// "Configure release signing" step in .github/workflows/build-apk.yml
// writes this same file (and the keystore it points to) from GitHub
// secrets before Gradle ever runs, so this file is the single code path
// both local and CI release builds go through.
//
// Whatever key signs one release build MUST sign every release build
// after it, forever — Android refuses to install an update whose
// signature doesn't match the currently-installed app, so a different
// key here means every existing beta user has to uninstall first. If
// this file/keystore is missing, `assembleRelease` still succeeds but
// produces an UNSIGNED apk (installable only after manual signing) —
// see the buildTypes.release block below.
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
def hasReleaseSigning = keystorePropertiesFile.exists()
if (hasReleaseSigning) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

// --- Version ------------------------------------------------------------
// versionCode/versionName live in version.properties (committed, plain
// text) instead of hardcoded here, so bumping a release is a one-line
// edit to that file — no Groovy syntax to touch. See version.properties
// for the increment rule.
def versionPropsFile = rootProject.file("version.properties")
def versionProps = new Properties()
versionProps.load(new FileInputStream(versionPropsFile))

android {
    namespace "com.bharatspace.app"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        // Permanent app identity — never change this. Changing the
        // applicationId makes Android (and the Play Store) treat it as a
        // completely different app with no update path from this one.
        applicationId "com.bharatspace.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode versionProps['VERSION_CODE'].toInteger()
        versionName versionProps['VERSION_NAME']
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            // R8 (Android's modern successor to ProGuard) strips unused
            // code and renames classes/methods/fields to short,
            // meaningless names — this doesn't make the app unbreakable,
            // but it meaningfully raises the effort needed to reverse
            // engineer it compared to shipping readable class/method
            // names. shrinkResources removes unused resources too, which
            // also just makes for a smaller APK.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
