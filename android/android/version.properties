# Single source of truth for the Android app's version — read by
# app/build.gradle. Bump BOTH lines for every release you distribute,
# and never reuse or decrease VERSION_CODE — Android treats it as the
# only signal for "is this an update or the same/older version," and an
# equal-or-lower versionCode makes an install silently fail as "already
# up to date" (or be rejected outright) on top of an existing install.
#
# VERSION_NAME is what humans see (Play Store listing, Settings > Apps).
# It can repeat a pattern (1.0.1, 1.0.2, ...) — it's VERSION_CODE that
# must strictly increase, release after release, forever.
#
# History: 1 / "1.0" was the original debug-signed APK handed to beta
# users directly (not through this file). This is the first release
# built with the permanent signing key — see keystore.properties /
# ../../.github/workflows/build-apk.yml.
VERSION_CODE=3
VERSION_NAME=1.0.2
